# Copy to ~/.config/shire/config.yaml, then run `shire validate` and `shire apply`.

serverMode: { keepAwake: true }
presets: { tailscale: { enabled: true } }
remote: { statusPage: tailnet, actions: restart }

alerts:
  macos: true
  phone: true
  crashLoop: 3 in 5m
  unhealthyFor: 2m

logs: { maxSize: 10MB, keep: 3 }

services:
  # Homebrew runs Postgres; Shire only watches it.
  postgres:
    external: homebrew.mxcl.postgresql@16
    health: { type: tcp, port: 5432 }

  # Bag End, a small web app: an API and the web front end that talks to it.
  bagend-api:
    command: node
    args: [dist/index.js]
    build: pnpm build
    cwd: ~/Code/bagend/server
    envFile: .env
    dependsOn: [postgres]
    health: { type: tcp, port: 3001 }

  bagend-web:
    command: pnpm
    args: [preview, --port, "5174"]
    build: pnpm build
    cwd: ~/Code/bagend/web
    dependsOn: [bagend-api]
    health: { type: http, url: http://localhost:5174 }

  # Keeps TradingView Desktop open with its debug port so the TradingView MCP works.
  tradingview:
    command: /Applications/TradingView.app/Contents/MacOS/TradingView
    args: [--remote-debugging-port=9222]
    adoptRunning: true
    health: { type: tcp, port: 9222 }
